name: workflows

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  intergration:  # ← your existing job (fix typo if you want)
    name: Continous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # ← updated

      - name: Lint code 
        run: echo "Linting repository"
      
      - name: Run unit tests
        run: echo "Runing unit tests"

  build-push-ecr-image:  # ← NEW job (same indentation as 'intergration')
    name: Continuous Delivery
    needs: intergration  # ← runs after your integration job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr 
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Debug secrets
        run: |
          echo "AWS_REGION: ${{ secrets.AWS_REGION }}"
          echo "ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}"
          echo "Full registry/repo: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}"

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}  # ← your ECR repo name
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
